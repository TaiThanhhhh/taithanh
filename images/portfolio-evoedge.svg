    <circle cx="1362" cy="746" r="4" fill="#6e7681"/><text x="1376" y="751" fill="#e6edf3">Stage 2 hold passed</text>
    <text x="1376" y="770" fill="#8b949e">13:30 · auto-logged</text>
  </g>

  <!-- Report strip (partly behind the text panel on mobile) -->
  <rect x="330" y="832" width="980" height="200" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="356" y="870" font-size="17" font-weight="600" fill="#e6edf3">Post Job Report</text>
  <rect x="356" y="892" width="34" height="42" rx="5" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="373" y="919" text-anchor="middle" font-size="10" font-weight="700" fill="#f87171">PDF</text>
  <text x="404" y="908" font-size="15" font-weight="600" fill="#e6edf3">PJR-A12-S3.pdf</text>
  <text x="404" y="929" font-size="13" fill="#8b949e">Template: Client standard v4 · 18 pages</text>
  <rect x="760" y="908" width="380" height="8" rx="4" fill="#30363d"/>
  <rect x="760" y="908" width="292" height="8" rx="4" fill="#2dd4bf"/>
  <text x="1160" y="917" font-size="13" fill="#8b949e">Generating · 77%</text>
</svg>
