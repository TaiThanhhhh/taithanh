  <rect x="1330" y="152" width="320" height="388" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="1354" y="190" font-size="17" font-weight="600" fill="#e6edf3">Sensors</text>
  <text x="1354" y="212" font-size="13" fill="#8b949e">MQTT · 12 msg/s</text>
  <g font-size="14">
    <line x1="1354" y1="232" x2="1650" y2="232" stroke="#30363d"/>
    <circle cx="1362" cy="260" r="4" fill="#22c55e"/><text x="1376" y="265" fill="#e6edf3">PT-101 Casing</text><text x="1376" y="287" font-size="22" font-weight="700" fill="#e6edf3">4,812 <tspan font-size="13" fill="#8b949e">psi</tspan></text>
    <line x1="1354" y1="306" x2="1650" y2="306" stroke="#30363d"/>
    <circle cx="1362" cy="334" r="4" fill="#22c55e"/><text x="1376" y="339" fill="#e6edf3">PT-102 Annulus</text><text x="1376" y="361" font-size="22" font-weight="700" fill="#e6edf3">248 <tspan font-size="13" fill="#8b949e">psi</tspan></text>
    <line x1="1354" y1="380" x2="1650" y2="380" stroke="#30363d"/>
    <circle cx="1362" cy="408" r="4" fill="#22c55e"/><text x="1376" y="413" fill="#e6edf3">TT-301 Temperature</text><text x="1376" y="435" font-size="22" font-weight="700" fill="#e6edf3">86.4 <tspan font-size="13" fill="#8b949e">°F</tspan></text>
    <line x1="1354" y1="454" x2="1650" y2="454" stroke="#30363d"/>
    <circle cx="1362" cy="482" r="4" fill="#f59e0b"/><text x="1376" y="487" fill="#e6edf3">FT-201 Flow</text><text x="1376" y="509" font-size="22" font-weight="700" fill="#e6edf3">0.0 <tspan font-size="13" fill="#8b949e">bpm</tspan></text>
  </g>

  <!-- Alarms -->
  <rect x="1330" y="560" width="320" height="252" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="1354" y="598" font-size="17" font-weight="600" fill="#e6edf3">Alarms</text>
  <text x="1354" y="642" font-size="30" font-weight="700" fill="#e6edf3">0 <tspan font-size="15" font-weight="500" fill="#8b949e">active</tspan></text>
  <line x1="1354" y1="664" x2="1650" y2="664" stroke="#30363d"/>
  <g font-size="13">
    <circle cx="1362" cy="690" r="4" fill="#f59e0b"/><text x="1376" y="695" fill="#e6edf3">Rate-of-rise warning</text>
