<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">EvoEdge casing pressure test dashboard</title>
  <desc id="desc">Illustrative mockup of a real-time casing pressure test: staged pressure ramps to a 5,000 psi target with a hold period, live KPIs and MQTT sensor readings. Sample data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1f"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#06090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="36" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="plot"><rect x="380" y="440" width="900" height="330"/></clipPath>
  </defs>

  <!-- Backdrop -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- App window (bleeds off the right and bottom edges) -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1600" height="1000" rx="20" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>
  <path d="M100 70h1580v52H80V90a20 20 0 0 1 20-20z" fill="#0a0e14"/>
  <line x1="80" y1="122" x2="1680" y2="122" stroke="#30363d"/>
  <circle cx="112" cy="96" r="6.5" fill="#ff5f57"/>
  <circle cx="134" cy="96" r="6.5" fill="#febc2e"/>
  <circle cx="156" cy="96" r="6.5" fill="#28c840"/>
  <text x="700" y="101" text-anchor="middle" font-size="14" fill="#8b949e">evoedge.local / wells / A-12 / casing-test</text>

  <!-- Sidebar -->
  <rect x="80" y="122" width="220" height="950" fill="#0a0e14"/>
  <line x1="300" y1="122" x2="300" y2="1070" stroke="#30363d"/>
  <path d="M120 148l14 8v16l-14 8-14-8v-16z" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="120" cy="164" r="4" fill="#2dd4bf"/>
  <text x="146" y="171" font-size="19" font-weight="700" fill="#e6edf3">EvoEdge</text>
  <g font-size="15" fill="#8b949e">
    <rect x="104" y="214" width="16" height="16" rx="4" fill="none" stroke="#6e7681" stroke-width="1.8"/>
    <text x="134" y="227">Overview</text>
    <rect x="96" y="250" width="188" height="40" rx="9" fill="#2dd4bf" fill-opacity="0.12"/>
    <rect x="96" y="250" width="3" height="40" rx="1.5" fill="#2dd4bf"/>
    <path d="M104 278l5-8 4 5 4-9 3 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="275" fill="#e6edf3" font-weight="600">Casing test</text>
    <circle cx="112" cy="319" r="7.5" fill="none" stroke="#6e7681" stroke-width="1.8"/>
    <text x="134" y="324">Live sensors</text>
    <rect x="104" y="358" width="16" height="12" rx="2" fill="none" stroke="#6e7681" stroke-width="1.8"/>
    <text x="134" y="371">FracLoader</text>
    <path d="M106 404h12M106 410h12M106 416h8" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round"/>
    <text x="134" y="418">Post Job Reports</text>
    <circle cx="112" cy="460" r="7.5" fill="none" stroke="#6e7681" stroke-width="1.8"/>
    <text x="134" y="465">Settings</text>
  </g>
  <text x="104" y="534" font-size="12" font-weight="600" fill="#6e7681" letter-spacing="1.2">ACTIVE WELLS</text>
  <g font-size="14" fill="#8b949e">
    <circle cx="110" cy="562" r="4" fill="#22c55e"/><text x="124" y="567" fill="#e6edf3">Well A-12</text><text x="270" y="567" text-anchor="end" fill="#6e7681">Stage 3</text>
    <circle cx="110" cy="594" r="4" fill="#22c55e"/><text x="124" y="599">Well B-07</text><text x="270" y="599" text-anchor="end" fill="#6e7681">Rig-up</text>
    <circle cx="110" cy="626" r="4" fill="#f59e0b"/><text x="124" y="631">Well C-03</text><text x="270" y="631" text-anchor="end" fill="#6e7681">Standby</text>
  </g>

  <!-- Page header -->
  <text x="330" y="176" font-size="30" font-weight="700" fill="#e6edf3">Casing pressure test</text>
  <text x="330" y="204" font-size="15" fill="#8b949e">Well A-12 · Stage 3 · Streaming over MQTT</text>
  <rect x="1078" y="152" width="92" height="34" rx="17" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.4"/>
  <circle cx="1098" cy="169" r="5" fill="#22c55e"/>
  <circle cx="1098" cy="169" r="10" fill="#22c55e" fill-opacity="0.25"/>
  <text x="1112" y="174" font-size="14" font-weight="600" fill="#4ade80">Live</text>
  <rect x="1182" y="152" width="128" height="34" rx="8" fill="#2dd4bf"/>
  <text x="1246" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#042f2e">Generate PJR</text>

  <!-- KPI cards -->
  <g>
    <rect x="330" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="352" y="260" font-size="14" fill="#8b949e">Casing pressure</text>
    <text x="352" y="302" font-size="32" font-weight="700" fill="#e6edf3">4,812<tspan font-size="16" fill="#8b949e" font-weight="500"> psi</tspan></text>
    <text x="352" y="326" font-size="13" fill="#4ade80">Holding · −0.18 psi/min</text>

    <rect x="580" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="602" y="260" font-size="14" fill="#8b949e">Test target</text>
    <text x="602" y="302" font-size="32" font-weight="700" fill="#e6edf3">5,000<tspan font-size="16" fill="#8b949e" font-weight="500"> psi</tspan></text>
    <text x="602" y="326" font-size="13" fill="#8b949e">Reached at 13:35</text>

    <rect x="830" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="852" y="260" font-size="14" fill="#8b949e">Hold time</text>
    <text x="852" y="302" font-size="32" font-weight="700" fill="#e6edf3">11:42<tspan font-size="16" fill="#8b949e" font-weight="500"> / 15:00</tspan></text>
    <rect x="852" y="317" width="186" height="6" rx="3" fill="#30363d"/>
    <rect x="852" y="317" width="145" height="6" rx="3" fill="#2dd4bf"/>

    <rect x="1080" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="1102" y="260" font-size="14" fill="#8b949e">Leak rate</text>
    <text x="1102" y="302" font-size="32" font-weight="700" fill="#e6edf3">0.18<tspan font-size="16" fill="#8b949e" font-weight="500"> psi/min</tspan></text>
    <rect x="1102" y="312" width="96" height="20" rx="10" fill="#22c55e" fill-opacity="0.14"/>
    <text x="1150" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">Within limit</text>
  </g>

  <!-- Chart card -->
  <rect x="330" y="360" width="980" height="452" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="356" y="398" font-size="17" font-weight="600" fill="#e6edf3">Pressure vs. time</text>
  <g font-size="13" fill="#8b949e">
    <rect x="964" y="387" width="14" height="4" rx="2" fill="#2dd4bf"/><text x="984" y="394">Casing</text>
    <rect x="1050" y="387" width="14" height="4" rx="2" fill="#60a5fa"/><text x="1070" y="394">Annulus</text>
    <path d="M1145 389h14" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 3"/><text x="1165" y="394">Target</text>
    <rect x="1225" y="383" width="12" height="12" rx="3" fill="#fbbf24" fill-opacity="0.25"/><text x="1243" y="394">Hold</text>
  </g>

