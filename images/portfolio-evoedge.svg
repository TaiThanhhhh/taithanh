  <g stroke="#ffffff" stroke-opacity="0.06">
    <line x1="380" y1="760" x2="1280" y2="760"/>
    <line x1="380" y1="701.8" x2="1280" y2="701.8"/>
    <line x1="380" y1="643.6" x2="1280" y2="643.6"/>
    <line x1="380" y1="585.5" x2="1280" y2="585.5"/>
    <line x1="380" y1="527.3" x2="1280" y2="527.3"/>
    <line x1="380" y1="469.1" x2="1280" y2="469.1"/>
  </g>
  <g font-size="12" fill="#6e7681" text-anchor="end">
    <text x="368" y="764">0</text><text x="368" y="706">1k</text><text x="368" y="648">2k</text>
    <text x="368" y="590">3k</text><text x="368" y="531">4k</text><text x="368" y="473">5k</text>
  </g>
  <g font-size="12" fill="#6e7681" text-anchor="middle">
    <text x="380" y="790">13:00</text><text x="560" y="790">13:10</text><text x="740" y="790">13:20</text>
    <text x="920" y="790">13:30</text><text x="1100" y="790">13:40</text><text x="1280" y="790">13:50</text>
  </g>

  <g clip-path="url(#plot)">
    <!-- Hold window -->
    <rect x="1010" y="440" width="270" height="320" fill="#fbbf24" fill-opacity="0.07"/>
    <line x1="1010" y1="440" x2="1010" y2="760" stroke="#fbbf24" stroke-opacity="0.45" stroke-dasharray="3 4"/>
    <text x="1020" y="458" font-size="12" font-weight="600" fill="#fbbf24">HOLD · 15 MIN</text>
    <!-- Target -->
    <line x1="380" y1="469.1" x2="1280" y2="469.1" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 6" stroke-opacity="0.9"/>
    <!-- Casing pressure: staged ramps 1,500 / 3,000 / 5,000 psi, then hold -->
    <path d="M380 760 L434 760 C452 760 506 672.7 524 672.7 L650 671.5 C668 671.5 722 585.5 740 585.5 L920 584.2 C938 584.2 992 469.1 1010 469.1 C1080 470.5 1150 476 1226 480 L1226 760 L380 760 Z" fill="url(#area)"/>
    <path d="M380 760 L434 760 C452 760 506 672.7 524 672.7 L650 671.5 C668 671.5 722 585.5 740 585.5 L920 584.2 C938 584.2 992 469.1 1010 469.1 C1080 470.5 1150 476 1226 480" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Annulus pressure -->
    <path d="M380 746 L434 746 C470 744 500 741 524 742 L650 743 C690 741 710 740 740 741 L920 742 C960 740 990 738 1010 739 L1226 741" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Live point + tooltip -->
  <circle cx="1226" cy="480" r="14" fill="#2dd4bf" fill-opacity="0.25" filter="url(#soft)"/>
  <circle cx="1226" cy="480" r="6.5" fill="#0d1117" stroke="#2dd4bf" stroke-width="3"/>
  <line x1="1226" y1="487" x2="1226" y2="760" stroke="#2dd4bf" stroke-opacity="0.35" stroke-dasharray="3 4"/>
  <rect x="1060" y="494" width="152" height="58" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="1076" y="519" font-size="16" font-weight="700" fill="#e6edf3">4,812 psi</text>
  <text x="1076" y="540" font-size="12" fill="#8b949e">13:47:20 · PT-101</text>

