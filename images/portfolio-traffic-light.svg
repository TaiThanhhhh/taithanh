    <rect x="96" y="210" width="3" height="40" rx="1.5" fill="#818cf8"/>
    <path d="M104 224l6-3 6 3 6-3v14l-6 3-6-3-6 3z" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round"/>
