    <path d="M880 361 C905 430 950 480 990 500" fill="none" stroke="#163a5c" stroke-width="3"/>
    <!-- City blocks -->
    <g fill="#121b2c">
      <rect x="331" y="361" width="66" height="56" rx="6"/><rect x="423" y="361" width="124" height="56" rx="6"/><rect x="573" y="361" width="134" height="56" rx="6"/><rect x="733" y="361" width="134" height="56" rx="6"/>
      <rect x="331" y="443" width="66" height="104" rx="6"/><rect x="423" y="443" width="124" height="104" rx="6"/><rect x="573" y="443" width="134" height="104" rx="6"/><rect x="733" y="443" width="134" height="104" rx="6"/><rect x="893" y="443" width="96" height="104" rx="6"/>
