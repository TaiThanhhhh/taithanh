    </g>
    <rect x="423" y="573" width="124" height="104" rx="6" fill="#10261f"/>
    <circle cx="460" cy="612" r="9" fill="#14532d" fill-opacity="0.7"/><circle cx="500" cy="640" r="12" fill="#14532d" fill-opacity="0.7"/><circle cx="515" cy="600" r="7" fill="#14532d" fill-opacity="0.7"/>
    <!-- Road centre lines -->
    <g stroke="#2b3750" stroke-width="1.5" stroke-dasharray="8 8">
