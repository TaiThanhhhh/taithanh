      <use href="#node" x="410" y="560"/><use href="#node" x="560" y="560"/><use href="#node" x="880" y="560"/>
      <use href="#node" x="410" y="690"/><use href="#node" x="720" y="690"/>
    </g>
    <use href="#node" x="880" y="430" color="#6e7681"/>
    <use href="#node" x="560" y="690" color="#f59e0b"/>
    <circle cx="880" cy="690" r="22" fill="#ef4444" fill-opacity="0.35" filter="url(#soft)"/>
    <use href="#node" x="880" y="690" color="#ef4444"/>
