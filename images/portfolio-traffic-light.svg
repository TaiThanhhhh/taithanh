<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Traffic light management system: live control map</title>
  <desc id="desc">Illustrative mockup of a traffic signal control dashboard: a live map of District 1 intersections, a selected intersection with Auto, Manual and SOS modes, a signal head countdown and the phase cycle. Sample data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f2e"/>
      <stop offset="0.55" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="36" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="map"><rect x="331" y="361" width="658" height="450" rx="11"/></clipPath>
    <!-- One intersection marker: dark ring + status dot (colour set by `color`). -->
    <g id="node">
      <circle r="11" fill="#0d1117" stroke="currentColor" stroke-width="3"/>
      <circle r="4" fill="currentColor"/>
    </g>
  </defs>

  <!-- Backdrop -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- App window -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1600" height="1000" rx="20" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>
  <path d="M100 70h1580v52H80V90a20 20 0 0 1 20-20z" fill="#0a0e14"/>
  <line x1="80" y1="122" x2="1680" y2="122" stroke="#30363d"/>
  <circle cx="112" cy="96" r="6.5" fill="#ff5f57"/>
  <circle cx="134" cy="96" r="6.5" fill="#febc2e"/>
  <circle cx="156" cy="96" r="6.5" fill="#28c840"/>
  <text x="700" y="101" text-anchor="middle" font-size="14" fill="#8b949e">tlms.local / district-1 / live-map</text>

  <!-- Sidebar -->
