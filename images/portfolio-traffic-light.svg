    <rect x="580" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="602" y="260" font-size="14" fill="#8b949e">Avg. latency</text>
    <text x="602" y="302" font-size="32" font-weight="700" fill="#e6edf3">48<tspan font-size="16" fill="#8b949e" font-weight="500"> ms</tspan></text>
    <text x="602" y="326" font-size="13" fill="#8b949e">p95 · 120 ms</text>

    <rect x="830" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="852" y="260" font-size="14" fill="#8b949e">Control mode</text>
    <text x="852" y="302" font-size="32" font-weight="700" fill="#e6edf3">21<tspan font-size="16" fill="#8b949e" font-weight="500"> auto</tspan></text>
    <text x="852" y="326" font-size="13" fill="#8b949e">2 manual · <tspan fill="#f87171">1 SOS</tspan></text>

    <rect x="1080" y="228" width="230" height="112" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="1102" y="260" font-size="14" fill="#8b949e">Avg. wait at red</text>
    <text x="1102" y="302" font-size="32" font-weight="700" fill="#e6edf3">38<tspan font-size="16" fill="#8b949e" font-weight="500"> s</tspan></text>
    <rect x="1102" y="312" width="118" height="20" rx="10" fill="#22c55e" fill-opacity="0.14"/>
    <text x="1161" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">−12% vs. fixed</text>
  </g>

