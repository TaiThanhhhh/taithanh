    <circle cx="110" cy="554" r="4" fill="#22c55e"/><text x="124" y="559">District 3</text><text x="270" y="559" text-anchor="end" fill="#6e7681">18</text>
    <circle cx="110" cy="586" r="4" fill="#22c55e"/><text x="124" y="591">Thủ Đức</text><text x="270" y="591" text-anchor="end" fill="#6e7681">31</text>
  </g>

  <!-- Page header -->
  <text x="330" y="176" font-size="30" font-weight="700" fill="#e6edf3">Live map</text>
  <text x="330" y="204" font-size="15" fill="#8b949e">District 1 · 24 intersections · updated 2 s ago</text>
  <rect x="1028" y="152" width="92" height="34" rx="17" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.4"/>
  <circle cx="1048" cy="169" r="5" fill="#22c55e"/>
  <circle cx="1048" cy="169" r="10" fill="#22c55e" fill-opacity="0.25"/>
