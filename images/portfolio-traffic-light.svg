  <line x1="300" y1="122" x2="300" y2="1070" stroke="#30363d"/>
  <rect x="106" y="144" width="22" height="40" rx="7" fill="none" stroke="#818cf8" stroke-width="2.6"/>
  <circle cx="117" cy="154" r="3.6" fill="#ef4444"/>
  <circle cx="117" cy="164" r="3.6" fill="#f59e0b"/>
  <circle cx="117" cy="174" r="3.6" fill="#22c55e"/>
  <text x="140" y="164" font-size="19" font-weight="700" fill="#e6edf3">TLMS</text>
  <text x="140" y="182" font-size="11" fill="#6e7681">Signal control</text>
