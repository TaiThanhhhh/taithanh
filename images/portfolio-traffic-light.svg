    <circle cx="1362" cy="258" r="4" fill="#ef4444"/><text x="1376" y="263" fill="#e6edf3">Hàm Nghi × Pasteur</text><text x="1376" y="283" font-size="12" fill="#f87171">INT-12 · SOS priority</text>
    <line x1="1354" y1="300" x2="1650" y2="300" stroke="#30363d"/>
    <circle cx="1362" cy="326" r="4" fill="#f59e0b"/><text x="1376" y="331" fill="#e6edf3">Tôn Đức Thắng × Hàm Nghi</text><text x="1376" y="351" font-size="12" fill="#8b949e">INT-15 · Manual</text>
    <line x1="1354" y1="368" x2="1650" y2="368" stroke="#30363d"/>
    <circle cx="1362" cy="394" r="4" fill="#6e7681"/><text x="1376" y="399" fill="#e6edf3">Đồng Khởi × Lý Tự Trọng</text><text x="1376" y="419" font-size="12" fill="#8b949e">INT-21 · Offline 11 min</text>
