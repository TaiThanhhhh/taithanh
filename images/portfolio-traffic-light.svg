      <rect x="400" y="500" width="5" height="12" rx="2"/><rect x="565" y="610" width="5" height="12" rx="2"/><rect x="725" y="480" width="5" height="12" rx="2"/>
      <rect x="715" y="510" width="5" height="12" rx="2"/><rect x="715" y="528" width="5" height="12" rx="2"/><rect x="725" y="600" width="5" height="12" rx="2"/>
      <rect x="640" y="555" width="12" height="5" rx="2"/><rect x="660" y="555" width="12" height="5" rx="2"/><rect x="760" y="561" width="12" height="5" rx="2"/>
      <rect x="500" y="685" width="12" height="5" rx="2"/><rect x="820" y="691" width="12" height="5" rx="2"/><rect x="885" y="740" width="5" height="12" rx="2"/>
    </g>
